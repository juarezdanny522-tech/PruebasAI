name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew ./waycore/gradlew

      - name: Configurar clave de Gemini (WayCore)
        run: |
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > waycore/local.properties
            echo "Clave de Gemini embebida en el APK de WayCore."
          else
            echo "::warning::No existe el secreto GEMINI_API_KEY; el APK pedirá la clave al abrir la app (o usa IA local)."
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # ── PruebasAI ──
      - name: Build debug APK (PruebasAI)
        run: ./gradlew assembleDebug

      - name: Build release APK (PruebasAI)
        id: build_release_app
        continue-on-error: true
        run: ./gradlew assembleRelease

      # ── WayCore (Karbys + WayHat) ──
      - name: Build debug APK (WayCore)
        working-directory: waycore
        run: ./gradlew assembleDebug

      - name: Build release APK (WayCore)
        id: build_release_waycore
        continue-on-error: true
        working-directory: waycore
        run: ./gradlew assembleRelease

      - name: Collect error reports
        if: failure()
        run: |
          mkdir -p error-logs
          echo "== Gradle daemon log ==" > error-logs/summary.txt
          for f in ~/.gradle/daemon/*/daemon-*.out.log; do
            [ -f "$f" ] && tail -n 500 "$f" >> error-logs/summary.txt
          done
          echo "== Build-script / Kotlin errors ==" >> error-logs/summary.txt
          find ~/.gradle . -name "*.error" -o -path "*kotlin-dsl/*error*" 2>/dev/null | head -20 | while read -r f; do
            echo "--- $f ---" >> error-logs/summary.txt
            tail -n 200 "$f" >> error-logs/summary.txt
          done
          echo "== FAILED / Exception traces ==" >> error-logs/summary.txt
          for f in ~/.gradle/daemon/*/daemon-*.out.log; do
            [ -f "$f" ] && grep -n -A 30 -E "FAILURE|FAILED|Exception|error:" "$f" | tail -n 400 >> error-logs/summary.txt
          done

      - name: Report errors as annotations
        if: failure()
        run: |
          if [ -f error-logs/summary.txt ]; then
            # Emite las líneas clave como anotaciones (único canal visible sin logs)
            grep -hE "What went wrong|Execution failed|FAILURE:|Manifest merger|uses-sdk|error:|e: file|Caused by" error-logs/summary.txt | tail -10 | while IFS= read -r line; do
              clean=$(echo "$line" | tr '\r\n' '  ' | cut -c1-450)
              echo "::error::${clean}"
            done
          fi

      - name: Upload error reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: error-logs
          if-no-files-found: ignore

      - name: Prepare APKs
        run: |
          mkdir -p dist
          VERSION_WAYCORE=$(grep 'versionName' waycore/app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          VERSION_APP=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "VERSION_WAYCORE=$VERSION_WAYCORE" >> "$GITHUB_ENV"
          echo "VERSION_APP=$VERSION_APP" >> "$GITHUB_ENV"

          # PruebasAI y WayCore (APKs universales arm64 + x86_64)
          [ -f app/build/outputs/apk/debug/app-debug.apk ] && cp app/build/outputs/apk/debug/app-debug.apk "dist/PruebasAI-debug.apk"
          [ -f app/build/outputs/apk/release/app-release.apk ] && cp app/build/outputs/apk/release/app-release.apk "dist/PruebasAI.apk"
          [ -f waycore/app/build/outputs/apk/debug/app-debug.apk ] && cp waycore/app/build/outputs/apk/debug/app-debug.apk "dist/WayCore-debug.apk"
          [ -f waycore/app/build/outputs/apk/release/app-release.apk ] && cp waycore/app/build/outputs/apk/release/app-release.apk "dist/WayCore.apk"
          ls -la dist/
          sha256sum dist/*.apk > dist/SHA256SUMS.txt || true
          cat dist/SHA256SUMS.txt || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PruebasAI-and-WayCore-APKs
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish dev-build prerelease (branch pushes)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: Development Build (auto)
          prerelease: true
          body: |
            ⚠️ **Build automático de desarrollo** (rama `${{ github.ref_name }}`, run #${{ github.run_number }}).

            ### PruebasAI
            Instalación: descarga `PruebasAI.apk` y ábrelo en tu teléfono Android.

            ### WayCore (Karbys + WayHat) v${{ env.VERSION_WAYCORE }}
            Instalación: descarga `WayCore.apk` (arm64-v8a, para tu teléfono) y ábrelo en Android.

            Novedades WayCore 0.7.0:
            - **IA 100% local con LiteRT-LM**: Karbys piensa dentro del teléfono, sin internet y sin clave API.
            - **Descarga de modelos desde la app**: Gemma 3 270M (304 MB), Qwen 1.5B (1.6 GB, ideal en español) y Gemma 4 E2B (2.6 GB).
            - **Modos Automático / Local / Gemini**: automático usa el modelo local primero y recurre a Gemini solo si hace falta.
            - **Karbys controla WayHat también con IA local** (herramientas seguras: modo, sensibilidad, buzzer, telemetría).
            - Se mantiene todo lo de v0.6.0: palabra clave confiable, "¿Dime?" con voz, clave API configurable en la app.

            Archivos: `WayCore.apk` (instalar en el teléfono) y `WayCore-debug.apk` (depuración).
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
