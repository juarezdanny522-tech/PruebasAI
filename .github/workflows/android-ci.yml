name: Android CI

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  gist: write

jobs:
  build:
    name: Construir APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permisos de gradlew
        run: chmod +x gradlew

      - name: Construir APKs (debug + release firmado)
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log || {
            echo "### ❌ Falló la compilación" >> "$GITHUB_STEP_SUMMARY"
            ERRORS=$(grep -E "^\s*e: |error:|FAILURE:|What went wrong|Caused by:|> Could not|> Task .* FAILED|error: resource" build.log | head -25)
            echo "$ERRORS" >> "$GITHUB_STEP_SUMMARY"
            echo "$ERRORS" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done
            gh gist create --desc "PruebasAI build log ${GITHUB_RUN_ID}" build.log 2>/dev/null || true
            exit 1
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Preparar APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PruebasAI-debug.apk
          cp app/build/outputs/apk/release/app-release.apk PruebasAI.apk
          ls -lh *.apk

      - name: Subir APKs como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PruebasAI-APKs
          path: '*.apk'
          retention-days: 90

      - name: Publicar prerelease «dev-build»
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-build -y --repo "$GITHUB_REPOSITORY" || true
          git push origin :refs/tags/dev-build || true
          gh release create dev-build PruebasAI.apk PruebasAI-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "PruebasAI · compilación de desarrollo" \
            --notes "APK generado automáticamente por GitHub Actions desde ${GITHUB_REF_NAME}. Instala **PruebasAI.apk** (firmado con la clave de desarrollo). Luego descarga un modelo desde la propia app." \
            --target "$GITHUB_SHA"

      - name: Publicar release de versión
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" PruebasAI.apk PruebasAI-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "PruebasAI $GITHUB_REF_NAME" \
            --notes "APK de PruebasAI $GITHUB_REF_NAME. Instala **PruebasAI.apk** y descarga un modelo desde la app." \
            --target "$GITHUB_SHA" || \
          gh release upload "$GITHUB_REF_NAME" PruebasAI.apk PruebasAI-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
